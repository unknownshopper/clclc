    <!-- Firebase Scripts -->
    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
      import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, deleteDoc, updateDoc, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
      import { getAuth, signInWithEmailAndPassword, signOut as fbSignOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
      
      // Import Firebase configuration from separate file
      import { firebaseConfig } from './firebase-config.js';

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      try {
        await setPersistence(auth, browserLocalPersistence);
      } catch (e) {
        console.warn('Firebase Auth persistence:', e?.message || e);
      }

      // Import video links
      import { videoLinks } from './data/video_links.js';
      window.videoLinks = videoLinks;

      // Firebase Auth helpers (admin-only writes)
      window.firebaseAuth = {
        async signIn(email, password) {
          await signInWithEmailAndPassword(auth, email, password);
        },
        async signInAdmin(email, password) {
          // Ensures admin is authenticated in Firebase to perform writes
          await signInWithEmailAndPassword(auth, email, password);
        },
        async signOut() {
          try { await fbSignOut(auth); } catch (e) { console.warn('SignOut Firebase:', e?.message || e); }
        }
      };

      const integrarEvaluacionesConRetry = (evaluacionesFirebase) => {
        try {
          if (typeof integrarDatosFirebase === 'function') {
            integrarDatosFirebase(evaluacionesFirebase);
            if (typeof aplicarCompatibilidadExistencia === 'function') {
              aplicarCompatibilidadExistencia();
            }
            window.__pendingEvaluacionesFirebase = null;
            return true;
          }
        } catch (e) {
          console.warn('Integración evaluaciones (retry) error:', e);
        }

        window.__pendingEvaluacionesFirebase = evaluacionesFirebase;
        // Reintentar un tiempo corto (carrera de carga de script.js)
        if (!window.__pendingEvaluacionesFirebaseRetrying) {
          window.__pendingEvaluacionesFirebaseRetrying = true;
          let intentos = 0;
          const timer = setInterval(() => {
            intentos++;
            const pending = window.__pendingEvaluacionesFirebase;
            if (!pending) {
              clearInterval(timer);
              window.__pendingEvaluacionesFirebaseRetrying = false;
              return;
            }
            if (typeof integrarDatosFirebase === 'function') {
              try {
                integrarDatosFirebase(pending);
                if (typeof aplicarCompatibilidadExistencia === 'function') {
                  aplicarCompatibilidadExistencia();
                }
                window.__pendingEvaluacionesFirebase = null;
                clearInterval(timer);
                window.__pendingEvaluacionesFirebaseRetrying = false;
              } catch (e2) {
                console.warn('Integración evaluaciones (retry) error:', e2);
              }
            }
            if (intentos >= 50) {
              clearInterval(timer);
              window.__pendingEvaluacionesFirebaseRetrying = false;
              console.warn('Integración evaluaciones: no se pudo completar por timeout');
            }
          }, 120);
        }
        return false;
      };

      // Mantener estado de Firebase Auth en refresh
      onAuthStateChanged(auth, async (user) => {
        window.__firebaseCurrentUser = user || null;
        // Considerar "admin" únicamente por el email autenticado en Firebase (evita carreras con window.usuarioActual)
        const adminEmail = 'unknownshoppersmx@gmail.com';
        window.firebaseAdminAuthenticated = !!(user && user.email && String(user.email).toLowerCase() === adminEmail);
        try {
          if (user && window.firebaseDB && typeof window.firebaseDB.cargarEvaluaciones === 'function') {
            const evaluacionesFirebase = await window.firebaseDB.cargarEvaluaciones();
            integrarEvaluacionesConRetry(evaluacionesFirebase);
          }

          if (typeof aplicarRestriccionesPorRol === 'function') {
            aplicarRestriccionesPorRol();
          }

          if (window.vistaActual === 'evaluaciones' && typeof renderEvaluaciones === 'function') {
            renderEvaluaciones();
          } else if (window.vistaActual === 'dashboard' && typeof renderDashboard === 'function') {
            renderDashboard();
          }
        } catch (e) {
          console.warn('onAuthStateChanged UI sync:', e);
        }
      });

      // Firebase functions for evaluations
      window.firebaseDB = {
        // Guardar evaluación en Firestore
        async guardarEvaluacion(evaluacionData) {
          try {
            const docRef = await addDoc(collection(db, 'evaluaciones'), {
              ...evaluacionData,
              fechaCreacion: new Date(),
              timestamp: Date.now()
            });
            console.log('Evaluación guardada en Firebase con ID:', docRef.id);
            return docRef.id;
          } catch (error) {
            console.error('Error guardando evaluación en Firebase:', error);
            throw error;
          }
        },

        // Cargar evaluaciones desde Firestore
        async cargarEvaluaciones(mes = null) {
          try {
            // IMPORTANTE: Para usuarios NO autenticados como admin en Firebase,
            // Firestore rechazará queries que incluyan documentos no autorizados (p.ej. borradores).
            // Por ello, en modo no-admin solo consultamos 'publicado'.
            const puedeVerBorradores = !!window.firebaseAdminAuthenticated;
            const base = collection(db, 'evaluaciones');

            let q;
            if (puedeVerBorradores) {
              if (mes) {
                q = query(base, where('mes', '==', mes), orderBy('fechaCreacion', 'desc'));
              } else {
                q = query(base, orderBy('fechaCreacion', 'desc'));
              }
            } else {
              if (mes) {
                q = query(base, where('mes', '==', mes), where('estadoPublicacion', '==', 'publicado'));
              } else {
                q = query(base, where('estadoPublicacion', '==', 'publicado'));
              }
            }
            
            const querySnapshot = await getDocs(q);
            const evaluaciones = [];
            
            querySnapshot.forEach((doc) => {
              evaluaciones.push({
                id: doc.id,
                ...doc.data()
              });
            });
            
            console.log(`Cargadas ${evaluaciones.length} evaluaciones desde Firebase`);
            return evaluaciones;
          } catch (error) {
            console.error('Error cargando evaluaciones desde Firebase:', error);
            return [];
          }
        },

        // Eliminar evaluación de Firestore
        async eliminarEvaluacion(entidadId, tipo, mes, modalidad = null) {
          try {
            // Buscar la evaluación por entidadId, tipo y mes
            const q = query(
              collection(db, 'evaluaciones'),
              where('entidadId', '==', entidadId),
              where('tipo', '==', tipo),
              where('mes', '==', mes)
            );
            
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
              console.log(`No se encontró evaluación para eliminar: ${entidadId} (${tipo}) - ${mes}`);
              return false;
            }
            
            // Eliminar documentos que coincidan con la modalidad indicada.
            // Nota: modalidad legacy puede no existir en documentos antiguos, por eso filtramos del lado del cliente.
            const deletePromises = [];
            querySnapshot.forEach((doc) => {
              const data = doc.data() || {};
              const modDoc = (data.modalidad ? String(data.modalidad).toLowerCase().trim() : 'kpi');
              const modWant = (modalidad ? String(modalidad).toLowerCase().trim() : null);
              if (!modWant || modDoc === modWant) {
                console.log(`Eliminando documento Firebase: ${doc.id}`);
                deletePromises.push(deleteDoc(doc.ref));
              }
            });

            if (deletePromises.length === 0) {
              console.log(`No se encontró evaluación para eliminar (por modalidad): ${entidadId} (${tipo}) - ${mes} - ${modalidad}`);
              return false;
            }
            
            await Promise.all(deletePromises);
            console.log(`Evaluación eliminada de Firebase: ${entidadId} (${tipo}) - ${mes}`);
            return true;
          } catch (error) {
            console.error('Error eliminando evaluación de Firebase:', error);
            throw error;
          }
        },

        // Actualizar evaluación en Firestore
        async actualizarEvaluacion(evaluacionId, datosActualizados) {
          try {
            await updateDoc(doc(db, 'evaluaciones', evaluacionId), {
              ...datosActualizados,
              fechaActualizacion: new Date(),
              timestampActualizacion: Date.now()
            });
            console.log('Evaluación actualizada en Firebase:', evaluacionId);
            return true;
          } catch (error) {
            console.error('Error actualizando evaluación en Firebase:', error);
            throw error;
          }
        },

        // Actualizar estado de publicación de una evaluación (opcionalmente con videoUrl)
        async actualizarEstadoPublicacion(entidadId, tipo, mes, nuevoEstado, videoUrl = null, modalidad = null) {
          try {
            // Buscar la evaluación por entidadId, tipo y mes
            const q = query(
              collection(db, 'evaluaciones'),
              where('entidadId', '==', entidadId),
              where('tipo', '==', tipo),
              where('mes', '==', mes)
            );
    
            const querySnapshot = await getDocs(q);
    
            if (querySnapshot.empty) {
              console.log(`No se encontró evaluación para actualizar: ${entidadId} (${tipo}) - ${mes}`);
              return false;
            }
    
            // Actualizar documentos que coincidan con la modalidad indicada.
            // Nota: modalidad legacy puede no existir en documentos antiguos, por eso filtramos del lado del cliente.
            const updatePromises = [];
            querySnapshot.forEach((doc) => {
              const data = doc.data() || {};
              const modDoc = (data.modalidad ? String(data.modalidad).toLowerCase().trim() : 'kpi');
              const modWant = (modalidad ? String(modalidad).toLowerCase().trim() : null);
              if (modWant && modDoc !== modWant) return;

              console.log(`Actualizando estado de publicación del documento: ${doc.id}`);
              const payload = {
                estadoPublicacion: nuevoEstado,
                fechaPublicacion: new Date(),
                timestampPublicacion: Date.now()
              };
              if (videoUrl && typeof videoUrl === 'string' && videoUrl.trim().length > 0) {
                payload.videoUrl = videoUrl.trim();
                payload.videoUrlUpdatedAt = new Date();
              }
              updatePromises.push(updateDoc(doc.ref, payload));
            });

            if (updatePromises.length === 0) {
              console.log(`No se encontró evaluación para actualizar (por modalidad): ${entidadId} (${tipo}) - ${mes} - ${modalidad}`);
              return false;
            }
    
            await Promise.all(updatePromises);
            console.log(`Estado de publicación actualizado: ${entidadId} (${tipo}) - ${mes} -> ${nuevoEstado}${videoUrl ? ' con videoUrl' : ''}`);
            return true;
          } catch (error) {
            console.error('Error actualizando estado de publicación:', error);
            throw error;
          }
        },

        async cargarCompetenciaPublicada() {
          try {
            const snap = await getDoc(doc(db, 'configuracion', 'competencia'));
            return snap.exists() ? snap.data() : null;
          } catch (error) {
            console.error('Error cargando configuración de competencia:', error);
            return null;
          }
        },

        async guardarCompetenciaPublicada(payload) {
          try {
            await setDoc(doc(db, 'configuracion', 'competencia'), {
              ...(payload || {}),
              fechaActualizacion: new Date(),
              timestampActualizacion: Date.now()
            }, { merge: true });
            console.log('Configuración de competencia publicada en Firebase');
            return true;
          } catch (error) {
            console.error('Error publicando configuración de competencia:', error);
            throw error;
          }
        },

        // Verificar conexión a Firebase
        async verificarConexion() {
          try {
            const testCollection = collection(db, 'test');
            console.log('Conexión a Firebase establecida correctamente');
            return true;
          } catch (error) {
            console.error('Error conectando a Firebase:', error);
            return false;
          }
        }
      };

      console.log('Firebase configurado correctamente');
    </script>
